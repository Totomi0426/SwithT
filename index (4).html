<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>S♡T</title>
<style>
:root{--bg:#eaeaea;--surface:#f7f7f7;--text:#333;--sub:#9b9b9b;--line:#ececec;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;}
.page{flex:1;min-height:0;display:none;flex-direction:column;}
.page.on{display:flex;}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ===== 开屏 ===== */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease,transform .6s ease;}
#splash.out{opacity:0;transform:translateY(-22px);visibility:hidden;}
.row{display:flex;gap:30px;margin-bottom:36px}
.row .h{font-size:32px;color:#bdbdbd;opacity:0;transform:translateY(5px);transition:opacity .55s ease,transform .55s ease}
.row .h.on{opacity:.6;transform:translateY(0)}
.bar{width:186px;height:3px;border-radius:3px;background:#e4e4e4;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:#c2c2c2}
.welcome{margin-top:20px;font-size:21px;letter-spacing:3px;color:#8f8f8f;opacity:0;transition:opacity 1.1s ease}
.welcome.on{opacity:1}

/* ===== 顶栏 ===== */
.head{flex:none;position:relative;display:flex;align-items:center;justify-content:center;padding:14px 56px 12px;background:var(--surface);border-bottom:1px solid var(--line);}
.head .title{font:inherit;font-size:16px;font-weight:600;color:var(--text);background:none;border:0;cursor:pointer;padding:3px 8px;border-radius:8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.head .title:active{background:#ececec}
.hbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:17px;line-height:1;color:#555;display:flex;align-items:center;justify-content:center;}
.hbtn:active{background:#ececec}
.hbtn.l{left:10px}
.hbtn.r{right:10px}
.hbtn svg{display:block}
.dots{font-size:20px;letter-spacing:1px;line-height:.6;padding-bottom:4px}
.addBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:23px;font-weight:300;line-height:1;color:#666;display:flex;align-items:center;justify-content:center;}
.addBtn:active{background:#ececec}

/* ===== 主页 ===== */
.homeC{flex:1;display:flex;align-items:center;justify-content:center;}
.bubbleBtn{width:132px;padding:26px 10px;border:0;border-radius:24px;background:#fff;cursor:pointer;box-shadow:0 4px 22px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;gap:12px;}
.bubbleBtn:active{transform:scale(.96)}
.bubbleBtn svg{display:block}
.bubbleBtn span{font-size:13px;color:var(--sub);letter-spacing:1px}

/* ===== 底部导航 ===== */
.bnav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.bnav button{flex:1;background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#c0c0c0;font-family:inherit;cursor:pointer;}
.bnav button.on{color:#4a4a4a}
.bnav svg{width:23px;height:23px;display:block}
.bnav span{font-size:10px;letter-spacing:.5px}

/* ===== 字卡库 ===== */
.tabs{flex:none;display:flex;gap:8px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line);}
.tab{flex:1;height:32px;border:0;border-radius:16px;background:#f0f0f0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer;}
.tab.on{background:#dedede;color:#3d3d3d}
.lib{padding:14px 14px 22px;}
.libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.libCard{width:100%;position:relative;background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.03);cursor:pointer;}
.libCard:active{transform:scale(.96)}
.libCard img{width:100%;border-radius:10px;display:block}
.libEmpty{text-align:center;color:#c6c6c6;font-size:12px;line-height:1.9;padding:60px 0 0;}
.libTip{text-align:center;color:#d0d0d0;font-size:10px;margin-top:26px;line-height:1.7}

/* ===== 字卡库：分组栏 + 卡片操作 ===== */
.grpBar{display:flex;align-items:center;gap:8px;margin:2px 0 12px;}
.chips{flex:1;min-width:0;display:flex;gap:7px;overflow-x:auto;padding:2px 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;cursor:pointer;font:inherit;font-size:12.5px;line-height:1;padding:8px 14px;border-radius:15px;background:#f1f1f1;color:#8a8a8a;white-space:nowrap;}
.chip.on{background:#3a3a3a;color:#fff;}
.grpAdd{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:#f1f1f1;color:#8a8a8a;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.grpAdd:active{background:#e6e6e6}
.libCard{padding:0;overflow:hidden;display:flex;flex-direction:column;}
.libCard .cv{padding:15px 8px;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;word-break:break-word;font-size:14px;line-height:1.45;color:#4a4a4a;}
.libCard .cv img{width:100%;border-radius:0;display:block}
.libCard .ops{flex:none;display:flex;border-top:1px solid #f2f2f2;}
.libCard .op{flex:1;min-width:0;height:29px;border:0;background:none;padding:0;margin:0;cursor:pointer;color:#c0c0c0;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.libCard .op svg{width:14px;height:14px;display:block}
.libCard .op + .op{border-left:1px solid #f2f2f2}
.libCard .op.edit:active{background:#f3f6f3;color:#7fae7f}
.libCard .op.del:active{background:#f9efef;color:#d07070}
.libCard .op.mv:active{background:#f0f3f8;color:#7d93bb}

/* ===== 消息 ===== */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 10px;-webkit-overflow-scrolling:touch;}
.chat>*{max-width:100%}
.msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:20px;padding:0 4px 0 14px;box-sizing:border-box;width:100%;}
.msg.in{justify-content:flex-start}
.msg.out{justify-content:flex-end}
.ava{width:36px;height:36px;flex:none;border-radius:50%;background:#d2d2d2;color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.me{background:#c2c2c2}
.ava.add{background:#efefef;color:#b5b5b5;font-size:21px;font-weight:300;box-shadow:none;border:1px dashed #d8d8d8;}
.ava.add:active{background:#e8e8e8}
.col{display:flex;flex-direction:column;flex:0 1 auto;min-width:0;max-width:calc(100% - 52px);}
.msg.in .col{align-items:flex-start}
.msg.out .col{align-items:flex-end}
/* 我发的：整行反向排 → 头像钉在气泡右侧，不依赖 order，任何浏览器都不会跑到左边 */
.msg.out{flex-direction:row-reverse;justify-content:flex-start}
.msg.in{flex-direction:row}
.bub{padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.bub img{max-width:100%;border-radius:8px;display:block}
.msg.in .bub{background:#fff;border-bottom-left-radius:5px}
.msg.out .bub{background:#e8e8e8;border-bottom-right-radius:5px}
.mt{margin-top:5px;font-size:9px;line-height:1.2;color:#cfcfcf;white-space:nowrap;}

/* 正在输入 */
.typingWrap{display:none;align-items:flex-start;gap:8px;margin:0 0 16px;padding:0 4px 0 14px;box-sizing:border-box;}
.typingWrap .bub{background:#fff;display:inline-block;padding:13px 15px;border-radius:14px;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.typingWrap i{width:6px;height:6px;border-radius:50%;background:#c9c9c9;display:inline-block;animation:bl 1.3s infinite;margin-right:5px}
.typingWrap i:last-child{margin-right:0}
.typingWrap i:nth-child(2){animation-delay:.18s}
.typingWrap i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}

/* ===== 输入栏 ===== */
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);}
#input{flex:1;min-width:0;height:38px;border:0;outline:0;background:#efefef;border-radius:19px;padding:0 16px;font:inherit;font-size:15px;color:var(--text);text-align:center;transition:text-align .15s;}
#input:focus{text-align:left}
#input::placeholder{color:#b6b6b6;text-align:center}
.send{width:38px;height:38px;flex:none;border:0;border-radius:50%;cursor:pointer;background:#c9c9c9;color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.send:active{transform:scale(.92)}

/* ===== 设置面板 ===== */
.sheetMask{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s;}
.sheetMask.on{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;z-index:76;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.sheet.on{transform:translateY(0);}
.grab{width:34px;height:4px;border-radius:4px;background:#dcdcdc;margin:0 auto 16px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.who .ava{cursor:pointer}
.who .nm{flex:1;min-width:0;font-size:15px;color:var(--text);background:none;border:0;outline:0;padding:4px 0;font:inherit;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who .nm::placeholder{color:#c0c0c0}
.rowItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);}
.rowItem .lb{font-size:14px;color:var(--text);flex:none}
.rowItem .vl{font:inherit;font-size:14px;color:var(--sub);text-align:right;background:none;border:0;outline:0;width:100%;min-width:0;}
.rowItem .vl:focus{color:var(--text)}
.rowItem .hint{font-size:10px;color:#c8c8c8;margin-top:3px;line-height:1.4;text-align:right}
.sheet .tip{font-size:10px;color:#c8c8c8;line-height:1.5;margin-top:14px;text-align:center}
.sheetAct{display:flex;gap:10px;margin-top:16px}
.sheetAct button{flex:1;height:40px;border:0;border-radius:11px;font:inherit;font-size:14px;cursor:pointer}
.bk{background:#f0f0f0;color:#666}
.dg{background:#f6eaea;color:#c96a6a}

/* ===== 新增字卡弹层 ===== */
.mask{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:24px;}
.mask.on{display:flex}
.card{width:100%;max-width:310px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.card h4{font-size:16px;font-weight:600;margin-bottom:6px}
.card p{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:14px}
.fld{width:100%;border:0;outline:0;background:#f2f2f2;border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;color:var(--text);margin-bottom:10px;resize:none;font-family:inherit;}
.fld::placeholder{color:#bfbfbf}
.upBox{width:100%;border:1px dashed #dcdcdc;border-radius:12px;padding:20px 10px;text-align:center;font-size:13px;color:#b0b0b0;cursor:pointer;margin-bottom:10px;background:#fafafa}
.upBox img{max-width:100%;max-height:150px;border-radius:8px;display:block;margin:0 auto}
.btns{display:flex;gap:10px;margin-top:4px}
.btns button{flex:1;height:40px;border:0;border-radius:11px;font:inherit;font-size:15px;cursor:pointer}
.c-no{background:#f0f0f0;color:#666}
.c-ok{background:#c9c9c9;color:#fff}
.lnk{display:inline-block;font-size:12px;color:#a0a0a0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;margin-bottom:12px}
.mask textarea.bulk{width:100%;box-sizing:border-box;border:0;outline:0;background:#f2f2f2;border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;color:var(--text);resize:vertical;min-height:150px;line-height:1.9;font-family:inherit;margin-bottom:8px}
.mask textarea.bulk::placeholder{color:#c8c8c8}
.cnt{font-size:11px;color:#b5b5b5;margin-bottom:10px}
.ctx{position:fixed;z-index:80;display:none;background:#fff;border-radius:11px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04)}
.ctx.on{display:block}
.ctx button{display:block;width:100%;border:0;background:none;font:inherit;font-size:14px;color:#d05a5a;padding:9px 22px;border-radius:7px;cursor:pointer;white-space:nowrap}
.ctx button:active{background:#f6f6f6}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(8px);background:rgba(48,48,48,.9);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:90;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<input id="photoInput" type="file" accept="image/*" style="display:none">
<input id="libInput" type="file" accept="image/*" style="display:none">

<div id="splash">
  <div class="row"><span class="h">♡</span><span class="h">♡</span><span class="h">♡</span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="welcome" id="welcome">欢迎回家</div>
</div>

<div id="app">

  <!-- 主页 -->
  <div class="page on" id="pageHome">
    <div class="head"><div class="title" style="cursor:default">主页</div></div>
    <div class="homeC">
      <button class="bubbleBtn" id="goChat">
        <svg width="42" height="34" viewBox="0 0 42 34" fill="none">
          <path d="M21 2C10.5 2 2 8.2 2 16c0 4.6 2.8 8.7 7.2 11.3-.6 2.3-2 4.6-3.9 6.2 3.4-.2 6.8-1.3 9.6-3.2 1.9.5 4 .8 6.1.8 10.5 0 19-6.2 19-14S31.5 2 21 2Z" fill="#fff" stroke="#cfcfcf" stroke-width="2"/>
          <circle cx="14" cy="16" r="1.9" fill="#c2c2c2"/><circle cx="21" cy="16" r="1.9" fill="#c2c2c2"/><circle cx="28" cy="16" r="1.9" fill="#c2c2c2"/>
        </svg>
        <span>去对话</span>
      </button>
    </div>
  </div>

  <!-- 字卡库 -->
  <div class="page" id="pageLib">
    <div class="head">
      <div class="title" style="cursor:default">字卡库</div>
      <button class="addBtn" id="libAdd">+</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="0">字卡</button>
      <button class="tab" data-t="1">表情包</button>
      <button class="tab" data-t="2">颜文字</button>
    </div>
    <div class="pbody">
      <div class="lib" id="lib0"></div>
      <div class="lib" id="lib1" style="display:none"></div>
      <div class="lib" id="lib2" style="display:none"></div>
    </div>
  </div>

  <!-- 对话页 -->
  <div class="page" id="pageChat">
    <div class="head">
      <button class="hbtn l" id="backBtn">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button class="title" id="nameBtn">改个备注</button>
      <button class="hbtn r dots" id="setBtn">···</button>
    </div>
    <div class="chat" id="chat"></div>
    <div style="flex:none;padding:0 12px;background:var(--surface)">
      <div class="typingWrap" id="typing"><div class="ava" id="typingAva">♡</div><div class="bub"><i></i><i></i><i></i></div></div>
    </div>
    <div class="foot">
      <input id="input" placeholder="说点什么…" autocomplete="off">
      <button class="send" id="send">↑</button>
    </div>
  </div>

  <div class="bnav" id="bnav">
    <button class="on" id="nHome">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 4l9 6.6V19a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 19v-8.4Z"/><path d="M9.4 20.6v-6.2h5.2v6.2"/></svg>
      <span>主页</span>
    </button>
    <button id="nLib">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.4V5.2a1.8 1.8 0 0 1 1.8-1.8H11a2 2 0 0 1 2 2v13.6a1.6 1.6 0 0 0-1.6-1.6H5.6A1.6 1.6 0 0 0 4 19.4Z"/><path d="M20 19.4V5.2a1.8 1.8 0 0 0-1.8-1.8H13a2 2 0 0 0-2 2v13.6a1.6 1.6 0 0 1 1.6-1.6h5.8A1.6 1.6 0 0 1 20 19.4Z"/></svg>
      <span>字卡库</span>
    </button>
  </div>
</div>

<!-- 设置面板 -->
<div class="sheetMask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="who">
    <div class="ava add" id="otherAvaBtn">+</div>
    <input class="nm" id="sheetName" placeholder="改个备注" maxlength="12">
  </div>
  <div class="rowItem">
    <div class="lb">回复时间<div class="hint">点一下填写秒数，对方按这个时间才回</div></div>
    <input class="vl" id="delayInput" inputmode="numeric" placeholder="3" style="max-width:70px">
  </div>
  <div class="rowItem">
    <div class="lb">最多发几条<div class="hint">每次随机 1 条到这个上限，不会每次都发满</div></div>
    <input class="vl" id="maxInput" inputmode="numeric" placeholder="1" style="max-width:70px">
  </div>
  <div class="tip">头像点一下直接从相册选 · 改完自动保存</div>
  <div class="sheetAct">
    <button class="bk" id="closeSheet">收起</button>
    <button class="dg" id="clearBtn">清空对话</button>
  </div>
</div>

<!-- 新增字卡 -->
<div class="mask" id="addMask">
  <div class="card">
    <h4 id="addTitle">新增字卡</h4>
    <p id="addDesc">写点什么，保存后点一下就能复制</p>
    <div id="addBulk" class="lnk">一次贴好多条（一行一条）</div>
    <textarea class="fld" id="addText" rows="3" placeholder="在这里写…"></textarea>
    <div class="upBox" id="upBox">点这里从相册选图</div>
    <div class="btns"><button class="c-no" id="addNo">取消</button><button class="c-ok" id="addOk">保存</button></div>
  </div>
</div>

<!-- 批量导入 -->
<div class="mask" id="bulkMask">
  <div class="card">
    <h4 id="bulkTitle">批量导入字卡</h4>
    <p id="bulkDesc">一行一条，粘贴多少就存多少</p>
    <textarea class="bulk" id="bulkText" rows="8" placeholder="今天也很想你&#10;早点睡&#10;想见你一面"></textarea>
    <div class="cnt" id="bulkCnt">0 条</div>
    <div class="btns"><button class="c-no" id="bulkNo">取消</button><button class="c-ok" id="bulkOk">全部导入</button></div>
  </div>
</div>

<!-- 确认 -->
<div class="mask" id="cfMask">
  <div class="card" style="width:74%">
    <h4 id="cfT">删除？</h4>
    <p id="cfS">删除后无法恢复</p>
    <div class="btns"><button class="c-no" id="cfNo">取消</button><button class="c-ok" id="cfYes">删除</button></div>
  </div>
</div>

<div class="ctx" id="ctx"><button id="ctxDel">删除</button></div>
<div id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var KEY='sht_chat_v6', LIBKEY='sht_lib_v1';
  var otherImg='';
  var cfg={delay:3,max:1};

  /* 字卡库：分组结构 {zc:[{n,g,v}...], bq:[...], ky:[...]}，grp={zc:[名...],bq:[...],ky:[...]} */
  var TABS=[{k:'zc',n:'字卡'},{k:'bq',n:'表情包'},{k:'ky',n:'颜文字'}];
  function blankLib(){var o={};for(var i=0;i<TABS.length;i++){o[TABS[i].k]=[];}return o;}
  function blankGrp(){var o={};for(var i=0;i<TABS.length;i++){o[TABS[i].k]=['默认分组'];}return o;}
  var lib=blankLib(),grp=blankGrp();
  try{
    var l=JSON.parse(localStorage.getItem(LIBKEY)||'{}');
    if(l&&typeof l==='object'){
      for(var i=0;i<TABS.length;i++){
        var k=TABS[i].k;
        if(Array.isArray(l[k])){                       /* 旧版：纯字符串数组 → 迁进默认分组 */
          for(var j=0;j<l[k].length;j++){
            var _it=l[k][j];
            if(typeof _it==='string')lib[k].push({n:'默认分组',g:0,v:_it,id:++SEQ});
            else if(_it&&typeof _it==='object'&&typeof _it.v==='string'){if(_it.id===undefined)_it.id=++SEQ;lib[k].push(_it);}
          }
        }
        if(Array.isArray(l.grp)&&l.grp.length)grp[k]=l.grp.slice();
        if(!grp[k].length)grp[k]=['默认分组'];
      }
    }
  }catch(e){}

  function save(){try{localStorage.setItem(KEY,JSON.stringify({name:state.name,img:state.img,other:otherImg,msgs:state.msgs,cfg:cfg}));}catch(e){}}
  function saveLib(){try{localStorage.setItem(LIBKEY,JSON.stringify({zc:lib.zc,bq:lib.bq,ky:lib.ky,grp:grp}));}catch(e){}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pad(n){return('0'+n).slice(-2);}
  function nowStr(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
  function initial(n){n=(n||'').trim();return n?n.slice(0,1):'♡';}
  function clampInt(v,def,min,max){v=parseInt(v,10);if(isNaN(v)||v<min)v=min;if(v>max)v=max;return v;}
  function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},1600);}
  function scrollEnd(){requestAnimationFrame(function(){var c=$('chat');c.scrollTop=c.scrollHeight;});}

  /* 旧记录兼容：拆掉「11月27日 12:12」这种写法 */
  function fixTime(x){
    if(x._f)return x;
    if(x.t==='the'&&x.s&&x.s.indexOf('还不会真的回话')>=0)x.s='（字卡库还空着，先去添几句吧）';
    var d=x.d||'',p=d.split(' ');
    if(p.length>1&&p[0].indexOf('月')>0){x.d=p[1];}
    if(!x.d||x.d.indexOf(':')<0){var t=new Date(x.ts||Date.now());x.d=pad(t.getHours())+':'+pad(t.getMinutes());}
    x._f=1;return x;
  }

  /* ===== 页面切换 ===== */

  /* ===== 对方回复：先打字动画，再按设置条数发 ===== */
  var busy=false;
  /* 对方只从字卡库抽：先字卡，字卡空了才用颜文字；表情包偶尔发一张。都没有才用兜底句 */
  function replyPool(){
    var zc=[],ky=[],bq=[],i;
    for(i=0;i<(lib.zc||[]).length;i++)zc.push(lib.zc[i].v);
    for(i=0;i<(lib.ky||[]).length;i++)ky.push(lib.ky[i].v);
    for(i=0;i<(lib.bq||[]).length;i++)bq.push(lib.bq[i].v);
    return {zc:zc,ky:ky,bq:bq};
  }
  function reply(){
    if(busy)return;
    var pool=replyPool();
    if(!pool.zc.length&&!pool.ky.length&&!pool.bq.length)return;
    busy=true;
    var n=clampInt(cfg.max,1,1,20);
    n=1+Math.floor(Math.random()*n);
    var d=clampInt(cfg.delay,3,0,600);
    $('typing').style.display='flex';scrollEnd();
    clearTimeout(reply._a);clearTimeout(reply._b);
    reply._a=setTimeout(function(){$('typing').style.display='none';},d*1000);
    reply._b=setTimeout(function(){
      var pick=[];
      for(var i=0;i<n;i++){
        var useImg=pool.bq.length&&Math.random()<0.25;
        if(useImg)pick.push({t:'in',img:pool.bq[Math.floor(Math.random()*pool.bq.length)],d:nowStr(),ts:Date.now()});
        else{
          var src=(pool.zc.length&&Math.random()<0.75)?pool.zc:pool.ky;
          if(!src.length)src=pool.zc.concat(pool.ky);
          pick.push({t:'in',x:src[Math.floor(Math.random()*src.length)],d:nowStr(),ts:Date.now()});
        }
      }
      for(var j=0;j<pick.length;j++)state.msgs.push(pick[j]);
      busy=false;render();save();scrollEnd();
    },d*1000+900);
  }
  function send(){
    var v=$('input').value.trim();if(!v)return;
    $('input').value='';
    state.msgs.push({t:'out',x:v,d:nowStr(),ts:Date.now()});
    render();save();scrollEnd();
    reply();
  }
  $('send').onclick=send;

  /* ===== 字卡库 ===== */
  var curTab=0,curGrp={zc:0,bq:0,ky:0};
  function cardHTML(kind,val){
    if(kind==='bq')return '<img src="'+val+'" alt="">';
    return esc(val);
  }
  var SEQ=0;
  try{for(var _i=0;_i<TABS.length;_i++){var _a=lib[TABS[_i].k]||[];for(var _j=0;_j<_a.length;_j++){if(_a[_j].id!==undefined&&_a[_j].id>SEQ)SEQ=_a[_j].id;}}}catch(e){}
  function idxOf(k,id){var a=lib[k]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return -1;}
  function curGrpName(){return grp[TABS[curTab].k][curGrp[TABS[curTab].k]]||'默认分组';}
  function memGrp(k){try{var g=JSON.parse(localStorage.getItem(LIBKEY+'g')||'{}');g[k]=curGrp[k]||0;localStorage.setItem(LIBKEY+'g',JSON.stringify(g));}catch(e){}}
  function bump(k){for(var i=0;i<TABS.length;i++)if(TABS[i].k===k)return TABS[i].n;return '字卡';}
  function renderLib(){
    for(var i=0;i<3;i++){
      var k=TABS[i].k,box=$('lib'+i);
      lib[k]=(lib[k]||[]).filter(function(x){return x&&typeof x.v==='string';});
      if(i!==curTab){box.textContent='';continue;}   /* 只渲染当前 tab，避免分组按钮跨 tab 串台 */
      try{var _g=JSON.parse(localStorage.getItem(LIBKEY+'g')||'{}');if(_g&&_g[k])curGrp[k]=_g[k];}catch(e){}
      var gi=curGrp[k]||0;
      grp[k]=grp[k]&&grp[k].length?grp[k]:['默认分组'];
      lib[k]=Array.isArray(lib[k])?lib[k]:[];
      if(gi>=grp[k].length){gi=0;curGrp[k]=0;}
      var gname=grp[k][gi]||'默认分组',h='',cnt=0;
      for(var j=0;j<(lib[k]||[]).length;j++){
        if(lib[k][j].n!==gname)continue;
        var it0=lib[k][j];if(it0.id===undefined)it0.id=++SEQ;
        h+='<div class="libCard" data-k="'+k+'" data-id="'+it0.id+'">'+
             '<div class="cv">'+cardHTML(k,lib[k][j].v)+'</div>'+
             '<div class="ops">'+
               '<button class="op edit" title="改" aria-label="改"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l4 4"/></svg></button>'+
               '<button class="op del" title="删" aria-label="删"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.2h5v2.3"/><path d="M6.5 6.5l1 13.3h9l1-13.3"/><path d="M10 10v6M14 10v6"/></svg></button>'+
               '<button class="op mv" title="移到别的分组" aria-label="移"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg></button>'+
             '</div>'+
           '</div>';
        cnt++;
      }
      var chips='';
      for(var t=0;t<grp[k].length;t++){
        chips+='<button class="chip'+(t===gi?' on':'')+'" data-k="'+k+'" data-t="'+t+'">'+esc(grp[k][t])+'</button>';
      }
      var body=cnt?('<div class="libGrid">'+h+'</div>'):'<div class="libEmpty">这个分组还是空的<br>点右上角 ＋ 加一个</div>';
      box.innerHTML='<div class="grpBar"><div class="chips">'+chips+'</div>'+
                    '<button class="grpAdd" data-k="'+k+'" title="新建分组" aria-label="新建分组">＋</button></div>'+body;
    }
  }
  /* 新建分组 */
  function addGroup(k){
    var v=window.prompt('新分组叫什么？','');
    if(v===null)return;
    v=String(v).replace(/[\s\u3000]+/g,' ').trim().slice(0,10);
    if(!v){toast('名字是空的');return;}
    if(grp[k].indexOf(v)>=0){curGrp[k]=grp[k].indexOf(v);saveLib();renderLib();return;}
    grp[k].push(v);curGrp[k]=grp[k].length-1;memGrp(k);saveLib();renderLib();
  }
  /* 编辑一条 */
  function editItem(k,i){
    var it=(lib[k]||[])[i];
    if(!it)return;
    if(k==='bq'){toast('表情包只能换图，不能改字');return;}
    var v=window.prompt('改一下',it.v);
    if(v===null)return;
    v=v.trim();
    if(!v){toast('空了就不改了');return;}
    it.v=v;saveLib();renderLib();
  }
  /* 移到别的分组：每点一次 ⬆ 顺移下一个组，绕一圈回来，不用弹窗输入 */
  function moveItem(k,i){
    var it=(lib[k]||[])[i];
    if(!it)return;
    var list=grp[k]||[];
    if(list.length<2){toast('只有一个分组，先点 ＋ 建一个');return;}
    var cur=list.indexOf(it.n);if(cur<0)cur=0;
    var nx=(cur+1)%list.length;
    it.n=list[nx];it.g=nx;
    curGrp[k]=nx;memGrp(k);saveLib();renderLib();
  }
  /* 删一条 */
  function delItem(k,i){

  var ts=document.querySelectorAll('.tabs .tab');
  for(var ti=0;ti<ts.length;ti++){

      renderLib();

  /* 卡片点击 → 复制 / 发表情包；✎ 🗑 ⬆ → 各自动作 */
  document.addEventListener('click',function(e){
    var op=e.target.closest('.op');
    if(op){
      e.stopPropagation();
      var p=op.closest('.libCard'),k=p.getAttribute('data-k'),i=idxOf(k,parseInt(p.getAttribute('data-id'),10));
      if(i<0)return;
      if(op.classList.contains('edit'))editItem(k,i);
      else if(op.classList.contains('del'))delItem(k,i);
      else if(op.classList.contains('mv'))moveItem(k,i);

    var chip=e.target.closest('.chip');

      var kk=chip.getAttribute('data-k');
      curGrp[kk]=parseInt(chip.getAttribute('data-t'),10)||0;memGrp(kk);renderLib();return;
    }
    var ga=e.target.closest('.grpAdd');
    if(ga){addGroup(ga.getAttribute('data-k'));return;}
    var el=e.target.closest('.libCard');
    if(!el)return;
    var _k=el.getAttribute('data-k'),_i=idxOf(_k,parseInt(el.getAttribute('data-id'),10));

  });
  function copy(t){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);toast('复制好了，去对话里粘上');return;}
    }catch(e){}
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('复制好了，去对话里粘上');}catch(e){toast('复制失败，长按手动选');}
    document.body.removeChild(ta);
  }
  $('libAdd').onclick=function(){openAdd();};

  /* ===== 批量导入（一行一条） ===== */
  var bulkKind='zc',dup=false;
  function bulkLines(){
    var raw=$('bulkText').value.replace(/\r/g,'').split('\n'),out=[],seen={},i,t;
    for(i=0;i<raw.length;i++){
      t=raw[i].replace(/^[\s\u3000]*[0-9]+[\.\、\)][\s\u3000]*/,'').trim();
      if(!t)continue;
      if(dup){if(seen[t])continue;seen[t]=1;}
      out.push(t);
    }
    return out;
  }
  function bulkCount(){$('bulkCnt').textContent=bulkLines().length+' 条';}

    try{var _m=JSON.parse(localStorage.getItem(LIBKEY+'g')||'{}');
        if(_m&&typeof _m[bulkKind]==='number'&&_m[bulkKind]<(grp[bulkKind]||[]).length)curGrp[bulkKind]=_m[bulkKind];}catch(e){}
    $('bulkTitle').textContent='批量导入'+TABS[curTab].n;
    $('bulkDesc').textContent='会全部放进「'+curGrpName()+'」，一行一条';
    $('bulkText').value='';
    $('bulkText').placeholder=bulkKind==='ky'?'(\u030C \u00B0 \u030C )\n( \u22B9 _ \u22B9 )\u0305':'一行一条，粘贴多少就存多少';
    $('bulkCnt').textContent='0 条';

    for(i=0;i<lib[bulkKind].length;i++)if(lib[bulkKind][i].n===gn)have[lib[bulkKind][i].v]=1;
    for(j=0;j<lines.length;j++){
      if(have[lines[j]])continue;
      have[lines[j]]=1;lib[bulkKind].push({n:gn,g:gi,v:lines[j],id:++SEQ});added++;
    }
    try{var _g=JSON.parse(localStorage.getItem(LIBKEY+'g')||'{}');_g[bulkKind]=curGrp[bulkKind]||0;localStorage.setItem(LIBKEY+'g',JSON.stringify(_g));}catch(e){}

  /* ===== 新增字卡 ===== */

    $('addDesc').textContent=addKind==='zc'?'字卡上写什么？保存后点一下就复制':
                            (addKind==='bq'?'选一张图当表情包，点一下直接发到对话里':'颜文字点一下就复制，比如 ( ˘ ³˘)♥');
    $('addText').value='';
    $('addText').style.display=(addKind==='bq')?'none':'block';
    $('upBox').style.display=(addKind==='bq')?'block':'none';
    $('upBox').innerHTML='点这里从相册选图';
    var lk=$('addBulk');
    if(lk){lk.style.display='inline-block';lk.textContent=(addKind==='bq')?'一次选好多张':'一次贴好多条（一行一条）';}
    $('addMask').classList.add('on');
  }
  function closeAdd(){$('addMask').classList.remove('on');}
  $('addNo').onclick=closeAdd;
  $('addMask').addEventListener('click',function(e){if(e.target===this)closeAdd();});
  $('addBulk').onclick=function(){
    if(TABS[curTab].k==='bq'){closeAdd();window.__pickLibMulti(function(list){
      var gn=curGrpName(),gi=curGrp.bq||0,ok=0,i;
      for(i=0;i<list.length;i++){lib.bq.push({n:gn,g:gi,v:list[i],id:++SEQ});ok++;}
      saveLib();renderLib();
      if(!ok)toast('没选到图');
    });return;}
    closeAdd();openBulk();
  };
  $('upBox').onclick=function(){window.__pickLib(function(d){addImg=d;$('upBox').innerHTML='<img src="'+d+'" alt="">';});};
  $('addOk').onclick=function(){
    var gn=curGrpName(),gi=curGrp[addKind]||0;
    if(addKind==='bq'){
      if(!addImg){toast('先选一张图');return;}
      lib.bq.push({n:gn,g:gi,v:addImg,id:++SEQ});
    }else{
      var v=$('addText').value.trim();
      if(!v){toast('还没写内容');return;}
      lib[addKind].push({n:gn,g:gi,v:v,id:++SEQ});
    }
    saveLib();closeAdd();renderLib();   /* 存好就关，不弹提示 */
  };

  /* ===== 长按菜单 ===== */
  var ctxK=null,ctxI=null;
  function showCtx(el,k,i){
    ctxK=k;ctxI=i;var c=$('ctx');c.classList.add('on');
    var w=c.offsetWidth||108,h=c.offsetHeight||48;
    var r=el.getBoundingClientRect();
    c.style.left=Math.min(Math.max(10,r.left),window.innerWidth-w-10)+'px';
    c.style.top=Math.min(Math.max(10,r.bottom+6),window.innerHeight-h-10)+'px';
  }
  function hideCtx(){$('ctx').classList.remove('on');}
  document.addEventListener('touchstart',function(e){if(!e.target.closest('#ctx'))hideCtx();},{passive:true});
  document.addEventListener('mousedown',function(e){if(e.target.closest('.libCard,.chip,.grpAdd'))return;if(!e.target.closest('#ctx'))hideCtx();});


  /* ===== 对话里长按删除 ===== */
  var timer=null,longed=false,sx=0,sy=0;
  function clearHold(){if(timer){clearTimeout(timer);timer=null;}}
  chatEl.addEventListener('touchstart',function(e){
    var el=e.target.closest('.msg');if(!el)return;
    longed=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;clearHold();
    timer=setTimeout(function(){longed=true;clearHold();showCtx(el,('msg'),parseInt(el.getAttribute('data-i'),10));if(navigator.vibrate)navigator.vibrate(15);},480);
  },{passive:true});
  chatEl.addEventListener('touchmove',function(e){
    if(!timer)return;var t=e.touches[0];
    if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10){clearHold();hideCtx();}
  },{passive:true});
  chatEl.addEventListener('touchend',function(e){clearHold();if(longed){e.preventDefault();e.stopPropagation();longed=false;}},{passive:false});
  chatEl.addEventListener('contextmenu',function(e){
    var el=e.target.closest('.msg');if(!el)return;e.preventDefault();showCtx(el,'msg',parseInt(el.getAttribute('data-i'),10));
  });
  window.__dbg={lib:function(){return JSON.parse(JSON.stringify(lib));},grp:function(){return JSON.parse(JSON.stringify(grp));},cur:function(){return curGrpName();},move:function(k,i){moveItem(k,i);}};
  /* 长按菜单（只服务对话里的消息） */
  $('ctxDel').onclick=function(){
    hideCtx();
    if(ctxK!=='msg'){ctxK=null;ctxI=null;return;}   /* 非消息来源不处理，避免误删字卡 */
    if(!state.msgs||ctxI===null||ctxI>=state.msgs.length){ctxK=null;ctxI=null;return;}
    var i=ctxI;ctxK=null;
    confirmBox('删除这条消息？','删除后无法恢复',function(){state.msgs.splice(i,1);render();save();});
  };

  window.__sendImg=function(d){
    state.msgs.push({t:'out',img:d,d:nowStr(),ts:Date.now()});
    show('pageChat');render();save();scrollEnd();reply();
  };

  $('nameBtn').textContent=state.name||'改个备注';
  $('delayInput').value=cfg.delay;
  $('maxInput').value=cfg.max;
  renderLib();
  render();
})();
</script>

<script>
(function(){
  var inp=document.getElementById("photoInput");
  var target="me",cb=null,multi=null;
  window.__pickPhoto=function(who){target=who||"me";cb=null;multi=null;inp.multiple=false;inp.click();};
  window.__pickLib=function(fn){cb=fn;multi=null;inp.multiple=false;inp.click();};
  window.__pickLibMulti=function(fn){multi=fn;cb=null;inp.multiple=true;inp.click();};
  /* 统一压缩成 320 方图，避免 localStorage 被大图撑爆 */
  function shrink(file,done){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=320,c=document.createElement("canvas");c.width=S;c.height=S;
        var x=c.getContext("2d"),k=Math.min(S/im.width,S/im.height);
        var w=im.width*k,h=im.height*k;
        x.drawImage(im,(S-w)/2,(S-h)/2,w,h);
        done(c.toDataURL("image/jpeg",0.82));
      };
      im.onerror=function(){done(null);};
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  }
  inp.onchange=function(){
    var files=inp.files?Array.prototype.slice.call(inp.files):[];
    if(!files.length)return;
    if(multi){                                   /* 批量：全部压完再一次回调 */
      var out=[],left=files.length,g=multi;multi=null;
      files.forEach(function(f){
        shrink(f,function(d){ if(d)out.push(d); if(--left===0){inp.value="";g(out);} });
      });
      return;
    }
    var c2=cb;cb=null;
    shrink(files[0],function(d){
      inp.value="";
      if(!d)return;
      if(c2){c2(d);return;}
      if(target==="other"&&window.__setOtherAvatar)window.__setOtherAvatar(d);
      else if(window.__setMyAvatar)window.__setMyAvatar(d);
    });
  };
})();
</script>

<script>
(function(){
  var sp=document.getElementById("splash"),fill=document.getElementById("fill"),
      hs=document.querySelectorAll(".row .h"),w=document.getElementById("welcome");
  var p=0,k=0;
  document.addEventListener("touchstart",function(){sp.style.pointerEvents="none";},{passive:true});
  var tm=setInterval(function(){
    p+=Math.random()*7+3.5; if(p>100)p=100;
    fill.style.width=p+"%";
    var want=p>=90?3:(p>=55?2:(p>=20?1:0));
    while(k<want){hs[k].classList.add("on");k++;}
    if(p>=100){clearInterval(tm);w.classList.add("on");
      setTimeout(function(){sp.classList.add("out");
        setTimeout(function(){sp.style.display="none";},600);},450);}
  },90);
})();
</script>
